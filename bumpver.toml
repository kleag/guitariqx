# Version bumps: uvx bumpver update --patch|--minor|--major
# (see docs/development.md, "Releasing"). CMake only takes numeric
# versions, hence no pre-release tags in the pattern. The git tag is the
# version (0.2.0), which starts release.yml.
[bumpver]
current_version = "0.3.4"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "Release {new_version}"
tag_message = "guitariqx {new_version}"
tag_scope = "default"
commit = true
tag = true
# pushing the tag publishes the release (.github/workflows/release.yml)
push = false

[bumpver.file_patterns]
"bumpver.toml" = ['current_version = "{version}"']
"CMakeLists.txt" = ["project(guitariqx VERSION {version} "]
"README.md" = ["guitariqx_{version}-1."]
"docs/install.md" = ["guitariqx_{version}-1."]
